name: Trading Vault checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - build/trading-vault-foundation
      - build/ci-test-verification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
