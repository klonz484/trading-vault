name: RCG isolated branch checks

on:
  push:
    branches:
      - fix/rcg-tick-cursor-and-duplicate-identity
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Type-check TypeScript
        run: npx tsc --noEmit
